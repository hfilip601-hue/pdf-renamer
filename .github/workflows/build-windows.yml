name: Build Windows EXE

on:
  push:
    branches: [main, master]
    paths:
      - 'rename_pdfs_varsym.py'
      - 'rename_pdfs_varsym_windows.spec'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build-mdbtools:
    name: Build mdbtools
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    outputs:
      mdbtools-path: ${{ steps.copy.outputs.mdbtools-path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSYS2 with UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-libiconv
            mingw-w64-ucrt-x86_64-readline
            git
            autoconf
            automake
            libtool
            pkg-config
          update: true
          cache: false

      - name: Build mdbtools from source
        run: |
          cd /tmp
          curl -L -o mdbtools-1.0.1.tar.gz https://github.com/mdbtools/mdbtools/releases/download/v1.0.1/mdbtools-1.0.1.tar.gz
          tar xzf mdbtools-1.0.1.tar.gz
          cd mdbtools-1.0.1
          autoreconf -fiv
          # Add CFLAGS to fix compilation issues with newer MinGW/UCRT64
          export CFLAGS="-D_GNU_SOURCE -D_POSIX_C_SOURCE=200809L -D__USE_MINGW_ANSI_STDIO=1 -Wno-error=implicit-function-declaration -Dlocale_t=_locale_t"
          # Disable extras to avoid _spawnv macro issues in mdbexport.c
          ./configure --prefix=/ucrt64 --disable-sql --disable-gmdb --disable-man --disable-extras
          # Patch mdbtools.h: fix locale_t typedef
          sed -i 's/typedef locale_t mdb_locale_t;/typedef _locale_t mdb_locale_t;/' include/mdbtools.h
          # Rename spawnv to mdb_spawnv everywhere to avoid conflict with system header
          find . -name "*.h" -o -name "*.c" | xargs sed -i 's/\bspawnv\b/mdb_spawnv/g'
          # Remove -D_spawnv=spawnv from generated Makefiles (added by configure/libtool)
          find . -name "Makefile" | xargs sed -i 's/-D_spawnv=spawnv//g'
          # Verify patches
          echo "=== Checking for spawnv references ==="
          grep -r "spawnv" include/ src/ 2>/dev/null || echo "No spawnv references found"
          echo "=== Checking for mdb_spawnv references ==="
          grep -r "mdb_spawnv" include/ src/ 2>/dev/null | head -20 || true
          make -j4
          # Install libraries (this works)
          make install DESTDIR=/tmp/mdbtools-install

      - name: Copy mdbtools to project for bundling
        id: copy
        run: |
          # Find where mdbtools was installed (libraries)
          echo "=== Searching for mdbtools install ==="
          find /tmp/mdbtools-install -name "*.dll" 2>/dev/null | head -20

          # Find built executables in build directory (src/util/.libs/)
          echo "=== Searching for built executables ==="
          find /tmp/mdbtools-1.0.1 -name "mdb-*.exe" 2>/dev/null

          # Copy to project structure
          mkdir -p mdbtools/bin
          mkdir -p mdbtools/lib

          # Copy executables from build directory
          cp /tmp/mdbtools-1.0.1/src/util/.libs/mdb-export.exe mdbtools/bin/ 2>/dev/null || cp /tmp/mdbtools-1.0.1/src/util/mdb-export.exe mdbtools/bin/
          cp /tmp/mdbtools-1.0.1/src/util/.libs/mdb-tables.exe mdbtools/bin/ 2>/dev/null || cp /tmp/mdbtools-1.0.1/src/util/mdb-tables.exe mdbtools/bin/
          cp /tmp/mdbtools-1.0.1/src/util/.libs/mdb-schema.exe mdbtools/bin/ 2>/dev/null || cp /tmp/mdbtools-1.0.1/src/util/mdb-schema.exe mdbtools/bin/

          # Copy ALL DLLs to bin/ directory (same folder as executables) so they're found at runtime
          # Windows DLL search order: executable's directory first
          cp /tmp/mdbtools-install/ucrt64/bin/*.dll mdbtools/bin/ 2>/dev/null || true
          cp /tmp/mdbtools-1.0.1/src/util/.libs/*.dll mdbtools/bin/ 2>/dev/null || true
          cp /tmp/mdbtools-1.0.1/src/libmdb/.libs/*.dll mdbtools/bin/ 2>/dev/null || true
          cp /tmp/mdbtools-1.0.1/src/libmdbsql/.libs/*.dll mdbtools/bin/ 2>/dev/null || true
          # Also copy glib, iconv, readline, intl DLLs from MSYS2
          cp /ucrt64/bin/libglib-2.0-0.dll mdbtools/bin/ 2>/dev/null || true
          cp /ucrt64/bin/libgobject-2.0-0.dll mdbtools/bin/ 2>/dev/null || true
          cp /ucrt64/bin/libgmodule-2.0-0.dll mdbtools/bin/ 2>/dev/null || true
          cp /ucrt64/bin/libgio-2.0-0.dll mdbtools/bin/ 2>/dev/null || true
          cp /ucrt64/bin/libintl.dll mdbtools/bin/ 2>/dev/null || true
          cp /ucrt64/bin/libiconv.dll mdbtools/bin/ 2>/dev/null || true
          cp /ucrt64/bin/libreadline*.dll mdbtools/bin/ 2>/dev/null || true
          cp /ucrt64/bin/libncursesw*.dll mdbtools/bin/ 2>/dev/null || true
          cp /ucrt64/bin/libpcre*.dll mdbtools/bin/ 2>/dev/null || true
          cp /ucrt64/bin/libffi*.dll mdbtools/bin/ 2>/dev/null || true
          cp /ucrt64/bin/zlib1.dll mdbtools/bin/ 2>/dev/null || true

          # Verify we have what we need
          if [ -f "mdbtools/bin/mdb-export.exe" ] && [ -f "mdbtools/bin/mdb-tables.exe" ] && [ -f "mdbtools/bin/mdb-schema.exe" ]; then
            echo "mdbtools ready for bundling"
            find mdbtools -type f | sort
            echo "mdbtools-path=${{ github.workspace }}/mdbtools" >> $GITHUB_OUTPUT
          else
            echo "ERROR: mdbtools executables not found"
            find /tmp/mdbtools-1.0.1 -name "mdb-*" -type f 2>/dev/null
            exit 1
          fi

      - name: Upload mdbtools artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdbtools-windows
          path: mdbtools/
          retention-days: 1

  build-exe:
    name: Build EXE
    runs-on: windows-latest
    timeout-minutes: 30
    needs: build-mdbtools
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download mdbtools artifact
        uses: actions/download-artifact@v4
        with:
          name: mdbtools-windows
          path: mdbtools

      - name: Verify mdbtools downloaded
        run: |
          dir mdbtools
          dir mdbtools\bin
          dir mdbtools\lib

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pandas pypdf pyinstaller

      - name: Build executable with PyInstaller (using spec file)
        run: |
          pyinstaller --clean rename_pdfs_varsym_windows.spec

      - name: Verify executable
        run: |
          dist\rename_pdfs_varsym.exe --help

      - name: Upload Windows EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rename_pdfs_varsym-windows
          path: dist/rename_pdfs_varsym.exe
          retention-days: 30

      - name: Create release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/rename_pdfs_varsym.exe
          generate_release_notes: true