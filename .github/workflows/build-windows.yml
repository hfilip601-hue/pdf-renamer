name: Build Windows EXE

on:
  push:
    branches: [main, master]
    paths:
      - 'rename_pdfs_varsym.py'
      - 'rename_pdfs_varsym_windows.spec'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSYS2 with UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-libiconv
            mingw-w64-ucrt-x86_64-readline
            git
            autoconf
            automake
            libtool
            pkg-config
            python
            python-pip
          update: true
          cache: false

      - name: Build mdbtools from source
        run: |
          cd /tmp
          curl -L -o mdbtools-1.0.1.tar.gz https://github.com/mdbtools/mdbtools/releases/download/v1.0.1/mdbtools-1.0.1.tar.gz
          tar xzf mdbtools-1.0.1.tar.gz
          cd mdbtools-1.0.1
          autoreconf -fiv
          # Add CFLAGS to fix compilation issues with newer MinGW/UCRT64:
          # - _GNU_SOURCE and _POSIX_C_SOURCE for locale_t and POSIX functions
          # - __USE_MINGW_ANSI_STDIO for printf format warnings
          # - Wno-error=implicit-function-declaration for implicit function warnings
          # - Dlocale_t=_locale_t to fix unknown type name locale_t (UCRT uses _locale_t)
          export CFLAGS="-D_GNU_SOURCE -D_POSIX_C_SOURCE=200809L -D__USE_MINGW_ANSI_STDIO=1 -Wno-error=implicit-function-declaration -Dlocale_t=_locale_t"
          ./configure --prefix=/ucrt64 --disable-sql --disable-gmdb --disable-man
          # Patch mdbtools.h to fix spawnv conflict and locale_t typedef
          sed -i 's/typedef locale_t mdb_locale_t;/typedef _locale_t mdb_locale_t;/' include/mdbtools.h
          # Remove spawnv declaration from mdbtools.h (conflicts with system header)
          # The declaration looks like: intptr_t spawnv(int, const char *, const char * const*);
          sed -i '/spawnv/d' include/mdbtools.h
          # Also patch any .c files that might declare spawnv
          find src -name "*.c" -exec sed -i '/spawnv/d' {} \;
          make -j4
          make install DESTDIR=/tmp/mdbtools-install

      - name: Copy mdbtools to project for bundling
        run: |
          installPath="/tmp/mdbtools-install/ucrt64"
          if [ -d "$installPath" ]; then
            mkdir -p mdbtools/bin
            mkdir -p mdbtools/lib
            # Copy executables
            cp "$installPath"/bin/mdb-*.exe mdbtools/bin/
            # Copy DLLs
            cp "$installPath"/bin/*.dll mdbtools/lib/
            # Also copy to root for fallback
            cp "$installPath"/bin/*.dll mdbtools/
            echo "mdbtools built and copied successfully"
            find mdbtools -type f | sort
          else
            echo "ERROR: mdbtools build output not found at $installPath"
            exit 1
          fi

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pandas pypdf pyinstaller

      - name: Build executable with PyInstaller (using spec file)
        run: |
          pyinstaller rename_pdfs_varsym_windows.spec

      - name: Verify executable
        run: |
          dist/rename_pdfs_varsym.exe --help

      - name: Upload Windows EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rename_pdfs_varsym-windows
          path: dist/rename_pdfs_varsym.exe
          retention-days: 30

      - name: Create release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/rename_pdfs_varsym.exe
          generate_release_notes: true