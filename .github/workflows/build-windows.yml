name: Build Windows EXE

on:
  push:
    branches: [main, master]
    paths:
      - 'rename_pdfs_varsym.py'
      - 'rename_pdfs_varsym_windows.spec'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSYS2 with UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-libiconv
            mingw-w64-ucrt-x86_64-readline
            git
            python
            python-pip
            7zip
          update: true
          cache: false

      - name: Download pre-built mdbtools Windows binaries
        run: |
          # Download pre-built mdbtools from GitHub releases (avoids compilation issues)
          cd /tmp
          curl -L -o mdbtools.zip https://github.com/mdbtools/mdbtools/releases/download/v1.0.1/mdbtools-1.0.1-win32.zip
          7z x mdbtools.zip -omdbtools-extracted

          # Find the extracted structure
          find mdbtools-extracted -type f \( -name "mdb-*.exe" -o -name "*.dll" \) | head -30

          # Copy to project structure
          mkdir -p mdbtools/bin
          mkdir -p mdbtools/lib

          # Copy executables and DLLs (adjust path based on actual zip structure)
          find mdbtools-extracted -name "mdb-*.exe" -exec cp {} mdbtools/bin/ \;
          find mdbtools-extracted -name "*.dll" -exec cp {} mdbtools/lib/ \;

          # Also copy DLLs to root for fallback
          cp mdbtools/lib/*.dll mdbtools/ 2>/dev/null || true

          echo "mdbtools downloaded and extracted successfully"
          find mdbtools -type f | sort

      - name: Copy mdbtools to project for bundling
        run: |
          # Files already copied in previous step, just verify
          if [ -f "mdbtools/bin/mdb-export.exe" ] && [ -f "mdbtools/bin/mdb-tables.exe" ]; then
            echo "mdbtools ready for bundling"
            find mdbtools -type f | sort
          else
            echo "ERROR: mdbtools executables not found"
            exit 1
          fi

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pandas pypdf pyinstaller

      - name: Build executable with PyInstaller (using spec file)
        run: |
          pyinstaller rename_pdfs_varsym_windows.spec

      - name: Verify executable
        run: |
          dist/rename_pdfs_varsym.exe --help

      - name: Upload Windows EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rename_pdfs_varsym-windows
          path: dist/rename_pdfs_varsym.exe
          retention-days: 30

      - name: Create release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/rename_pdfs_varsym.exe
          generate_release_notes: true