name: Build Windows EXE

on:
  push:
    branches: [main, master]
    paths:
      - 'rename_pdfs_varsym.py'
      - 'rename_pdfs_varsym_windows.spec'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install mdbtools via MSYS2
        run: |
          # MSYS2 is pre-installed on windows-latest
          # Use pacman to install mdbtools
          C:\msys64\usr\bin\bash -lc "pacman -Sy --noconfirm mdbtools"

      - name: Copy mdbtools to project for bundling
        run: |
          # MSYS2 installs to /usr/bin in MSYS2 paths
          $msysBin = "C:\msys64\usr\bin"
          if (Test-Path $msysBin) {
            New-Item -ItemType Directory -Force -Path "mdbtools\bin"
            New-Item -ItemType Directory -Force -Path "mdbtools\lib"

            # Copy executables
            Get-ChildItem "$msysBin\mdb-*.exe" | ForEach-Object {
              Copy-Item $_.FullName "mdbtools\bin\" -Force
            }

            # Copy DLLs (mdbtools dependencies)
            Get-ChildItem "$msysBin\*.dll" | Where-Object { $_.Name -match "lib(mdb|glib|intl|iconv|pcre|readline|termcap|winpthread)" } | ForEach-Object {
              Copy-Item $_.FullName "mdbtools\lib\" -Force
            }

            # Also copy to root for fallback
            Get-ChildItem "$msysBin\*.dll" | Where-Object { $_.Name -match "lib(mdb|glib|intl|iconv|pcre|readline|termcap|winpthread)" } | ForEach-Object {
              Copy-Item $_.FullName "mdbtools\" -Force
            }

            Write-Host "mdbtools copied successfully from MSYS2"
            Get-ChildItem "mdbtools" -Recurse
          } else {
            Write-Error "MSYS2 not found at C:\msys64"
            exit 1
          }

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pandas pypdf pyinstaller

      - name: Build executable with PyInstaller (using spec file)
        run: |
          pyinstaller rename_pdfs_varsym_windows.spec

      - name: Verify executable
        run: |
          dist\rename_pdfs_varsym.exe --help

      - name: Upload Windows EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rename_pdfs_varsym-windows
          path: dist/rename_pdfs_varsym.exe
          retention-days: 30

      - name: Create release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/rename_pdfs_varsym.exe
          generate_release_notes: true