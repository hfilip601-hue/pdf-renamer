name: Build Windows EXE

on:
  push:
    branches: [main, master]
    paths:
      - 'rename_pdfs_varsym.py'
      - 'rename_pdfs_varsym_windows.spec'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chocolatey
        uses: crazy-max/ghaction-chocolatey@v3
        with:
          args: 'install mdbtools --version=1.0.0 -y'

      - name: Copy mdbtools to project for bundling
        run: |
          # Chocolatey installs to C:\ProgramData\chocolatey\lib\mdbtools\tools\
          $chocoPath = "C:\ProgramData\chocolatey\lib\mdbtools\tools"
          if (Test-Path $chocoPath) {
            # Create mdbtools directory structure
            New-Item -ItemType Directory -Force -Path "mdbtools\bin"
            New-Item -ItemType Directory -Force -Path "mdbtools\lib"

            # Copy executables to bin/
            Copy-Item "$chocoPath\*.exe" "mdbtools\bin\" -Force

            # Copy DLLs to lib/
            Copy-Item "$chocoPath\*.dll" "mdbtools\lib\" -Force

            # Also copy any DLLs in root to lib/
            Get-ChildItem "$chocoPath\*.dll" | ForEach-Object {
              Copy-Item $_.FullName "mdbtools\" -Force
            }

            Write-Host "mdbtools copied successfully"
            Get-ChildItem "mdbtools" -Recurse
          } else {
            Write-Error "Chocolatey mdbtools not found at $chocoPath"
            exit 1
          }

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pandas pypdf pyinstaller

      - name: Build executable with PyInstaller (using spec file)
        run: |
          pyinstaller rename_pdfs_varsym_windows.spec

      - name: Verify executable
        run: |
          dist\rename_pdfs_varsym.exe --help

      - name: Upload Windows EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rename_pdfs_varsym-windows
          path: dist/rename_pdfs_varsym.exe
          retention-days: 30

      - name: Create release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/rename_pdfs_varsym.exe
          generate_release_notes: true