name: Build Windows EXE

on:
  push:
    branches: [main, master]
    paths:
      - 'rename_pdfs_varsym.py'
      - 'rename_pdfs_varsym_windows.spec'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install mdbtools via Scoop
        run: |
          # Scoop is pre-installed on windows-latest
          scoop install mdbtools

      - name: Copy mdbtools to project for bundling
        run: |
          # Scoop installs to ~/scoop/apps/mdbtools/current/
          $scoopPath = "$env:USERPROFILE\scoop\apps\mdbtools\current"
          if (Test-Path $scoopPath) {
            New-Item -ItemType Directory -Force -Path "mdbtools\bin"
            New-Item -ItemType Directory -Force -Path "mdbtools\lib"

            # Copy executables
            Get-ChildItem "$scoopPath\*.exe" | ForEach-Object {
              Copy-Item $_.FullName "mdbtools\bin\" -Force
            }

            # Copy DLLs
            Get-ChildItem "$scoopPath\*.dll" | ForEach-Object {
              Copy-Item $_.FullName "mdbtools\lib\" -Force
            }

            # Also copy to root for fallback
            Get-ChildItem "$scoopPath\*.dll" | ForEach-Object {
              Copy-Item $_.FullName "mdbtools\" -Force
            }

            Write-Host "mdbtools copied successfully from Scoop"
            Get-ChildItem "mdbtools" -Recurse
          } else {
            Write-Error "Scoop mdbtools not found at $scoopPath"
            exit 1
          }

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pandas pypdf pyinstaller

      - name: Build executable with PyInstaller (using spec file)
        run: |
          pyinstaller rename_pdfs_varsym_windows.spec

      - name: Verify executable
        run: |
          dist\rename_pdfs_varsym.exe --help

      - name: Upload Windows EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rename_pdfs_varsym-windows
          path: dist/rename_pdfs_varsym.exe
          retention-days: 30

      - name: Create release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/rename_pdfs_varsym.exe
          generate_release_notes: true