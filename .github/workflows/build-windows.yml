name: Build Windows EXE

on:
  push:
    branches: [main, master]
    paths:
      - 'rename_pdfs_varsym.py'
      - 'rename_pdfs_varsym_windows.spec'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MSYS2 build dependencies
        run: |
          C:/msys64/usr/bin/bash -lc "pacman -Sy --noconfirm --needed base-devel mingw-w64-x86_64-toolchain mingw-w64-x86_64-glib2 mingw-w64-x86_64-libiconv mingw-w64-x86_64-readline git autoconf automake libtool pkg-config"

      - name: Build mdbtools from source
        run: |
          $script = @"
          export PATH=/mingw64/bin:\$PATH
          cd /tmp
          curl -L -o mdbtools-1.0.1.tar.gz https://github.com/mdbtools/mdbtools/releases/download/v1.0.1/mdbtools-1.0.1.tar.gz
          tar xzf mdbtools-1.0.1.tar.gz
          cd mdbtools-1.0.1
          autoreconf -fiv
          ./configure --prefix=/mingw64 --disable-sql --disable-gmdb --disable-man
          make -j4
          make install DESTDIR=/tmp/mdbtools-install
          "@
          $scriptPath = "C:\msys64\tmp\build_mdbtools.sh"
          Set-Content -Path $scriptPath -Value $script -NoNewline
          C:/msys64/usr/bin/bash /tmp/build_mdbtools.sh

      - name: Copy mdbtools to project for bundling
        run: |
          $installPath = "C:\msys64\tmp\mdbtools-install\mingw64"
          if (Test-Path $installPath) {
            New-Item -ItemType Directory -Force -Path "mdbtools\bin"
            New-Item -ItemType Directory -Force -Path "mdbtools\lib"

            # Copy executables
            Get-ChildItem "$installPath\bin\mdb-*.exe" | ForEach-Object {
              Copy-Item $_.FullName "mdbtools\bin\" -Force
            }

            # Copy DLLs
            Get-ChildItem "$installPath\bin\*.dll" | ForEach-Object {
              Copy-Item $_.FullName "mdbtools\lib\" -Force
            }

            # Also copy to root for fallback
            Get-ChildItem "$installPath\bin\*.dll" | ForEach-Object {
              Copy-Item $_.FullName "mdbtools\" -Force
            }

            Write-Host "mdbtools built and copied successfully"
            Get-ChildItem "mdbtools" -Recurse
          } else {
            Write-Error "mdbtools build output not found at $installPath"
            exit 1
          }

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pandas pypdf pyinstaller

      - name: Build executable with PyInstaller (using spec file)
        run: |
          pyinstaller rename_pdfs_varsym_windows.spec

      - name: Verify executable
        run: |
          dist\rename_pdfs_varsym.exe --help

      - name: Upload Windows EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rename_pdfs_varsym-windows
          path: dist/rename_pdfs_varsym.exe
          retention-days: 30

      - name: Create release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/rename_pdfs_varsym.exe
          generate_release_notes: true