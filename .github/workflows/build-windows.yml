name: Build Windows EXE

on:
  push:
    branches: [main, master]
    paths:
      - 'rename_pdfs_varsym.py'
      - 'rename_pdfs_varsym_windows.spec'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install mdbtools via winget
        run: |
          # winget is pre-installed on windows-latest
          winget install --id=BrianB.mdbtools --silent --accept-source-agreements --accept-package-agreements
          # Or try the generic name
          if ($LASTEXITCODE -ne 0) {
            winget install mdbtools --silent --accept-source-agreements --accept-package-agreements
          }

      - name: Copy mdbtools to project for bundling
        run: |
          # winget installs to various locations, search common ones
          $possiblePaths = @(
            "C:\Program Files\mdbtools",
            "C:\Program Files (x86)\mdbtools",
            "$env:LOCALAPPDATA\Microsoft\WinGet\Packages\BrianB.mdbtools_*\mdbtools",
            "C:\winget\mdbtools"
          )

          $found = $false
          foreach ($path in $possiblePaths) {
            $expanded = Get-Item $path -ErrorAction SilentlyContinue
            if ($expanded) {
              $found = $true
              $installPath = $expanded.FullName
              break
            }
          }

          if (-not $found) {
            # Search for mdbtools executables anywhere
            $exe = Get-Command mdb-export -ErrorAction SilentlyContinue
            if ($exe) {
              $installPath = Split-Path $exe.Source
              $found = $true
            }
          }

          if ($found) {
            New-Item -ItemType Directory -Force -Path "mdbtools\bin"
            New-Item -ItemType Directory -Force -Path "mdbtools\lib"

            Get-ChildItem "$installPath\*.exe" | ForEach-Object { Copy-Item $_.FullName "mdbtools\bin\" -Force }
            Get-ChildItem "$installPath\*.dll" | ForEach-Object { Copy-Item $_.FullName "mdbtools\lib\" -Force }
            Get-ChildItem "$installPath\*.dll" | ForEach-Object { Copy-Item $_.FullName "mdbtools\" -Force }

            Write-Host "mdbtools copied from $installPath"
            Get-ChildItem "mdbtools" -Recurse
          } else {
            Write-Error "Could not locate mdbtools installation"
            exit 1
          }

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pandas pypdf pyinstaller

      - name: Build executable with PyInstaller (using spec file)
        run: |
          pyinstaller rename_pdfs_varsym_windows.spec

      - name: Verify executable
        run: |
          dist\rename_pdfs_varsym.exe --help

      - name: Upload Windows EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rename_pdfs_varsym-windows
          path: dist/rename_pdfs_varsym.exe
          retention-days: 30

      - name: Create release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/rename_pdfs_varsym.exe
          generate_release_notes: true