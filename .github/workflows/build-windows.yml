name: Build Windows EXE

on:
  push:
    branches: [main, master]
    paths:
      - 'rename_pdfs_varsym.py'
      - 'rename_pdfs_varsym_windows.spec'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSYS2 with UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-libiconv
            mingw-w64-ucrt-x86_64-readline
            git
            autoconf
            automake
            libtool
            pkg-config
            python
            python-pip
            mingw-w64-ucrt-x86_64-mdbtools
          update: true
          cache: false

      - name: Copy mdbtools to project for bundling
        run: |
          # Use MSYS2 installed mdbtools (pre-built, compatible with UCRT64)
          installPath="/ucrt64"
          if [ -d "$installPath" ]; then
            mkdir -p mdbtools/bin
            mkdir -p mdbtools/lib
            # Copy executables
            cp "$installPath"/bin/mdb-*.exe mdbtools/bin/
            # Copy DLLs
            cp "$installPath"/bin/*.dll mdbtools/lib/
            # Also copy to root for fallback
            cp "$installPath"/bin/*.dll mdbtools/
            echo "mdbtools copied successfully from MSYS2 package"
            find mdbtools -type f | sort
          else
            echo "ERROR: mdbtools not found at $installPath"
            exit 1
          fi

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pandas pypdf pyinstaller

      - name: Build executable with PyInstaller (using spec file)
        run: |
          pyinstaller rename_pdfs_varsym_windows.spec

      - name: Verify executable
        run: |
          dist/rename_pdfs_varsym.exe --help

      - name: Upload Windows EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rename_pdfs_varsym-windows
          path: dist/rename_pdfs_varsym.exe
          retention-days: 30

      - name: Create release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/rename_pdfs_varsym.exe
          generate_release_notes: true