name: Build Windows EXE

on:
  push:
    branches: [main, master]
    paths:
      - 'rename_pdfs_varsym.py'
      - 'rename_pdfs_varsym_windows.spec'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download mdbtools Windows binaries
        run: |
          # Create mdbtools directory structure
          New-Item -ItemType Directory -Force -Path "mdbtools\bin"
          New-Item -ItemType Directory -Force -Path "mdbtools\lib"

          # Download mdbtools from official source
          # Using a known working build from GitHub or alternative
          $mdbtoolsUrl = "https://github.com/brianb/mdbtools/releases/download/1.0.0/mdbtools-1.0.0-win64.zip"
          $zipPath = "mdbtools.zip"

          try {
            Invoke-WebRequest -Uri $mdbtoolsUrl -OutFile $zipPath -UseBasicParsing
            Expand-Archive -Path $zipPath -DestinationPath "mdbtools_temp" -Force

            # Copy executables
            Get-ChildItem "mdbtools_temp\bin\*.exe" | ForEach-Object {
              Copy-Item $_.FullName "mdbtools\bin\" -Force
            }

            # Copy DLLs
            Get-ChildItem "mdbtools_temp\bin\*.dll" | ForEach-Object {
              Copy-Item $_.FullName "mdbtools\lib\" -Force
            }
            Get-ChildItem "mdbtools_temp\lib\*.dll" | ForEach-Object {
              Copy-Item $_.FullName "mdbtools\lib\" -Force
            }

            Remove-Item -Recurse -Force "mdbtools_temp"
            Remove-Item -Force $zipPath
            Write-Host "mdbtools downloaded and extracted successfully"
            Get-ChildItem "mdbtools" -Recurse
          } catch {
            Write-Warning "Failed to download from primary source, trying alternative..."
            # Alternative: use MSYS2 or pre-built binaries
            $altUrl = "https://github.com/mdbtools/mdbtools/releases/download/1.0.0/mdbtools-1.0.0-win64.zip"
            try {
              Invoke-WebRequest -Uri $altUrl -OutFile $zipPath -UseBasicParsing
              Expand-Archive -Path $zipPath -DestinationPath "mdbtools_temp" -Force
              Get-ChildItem "mdbtools_temp\**\*.exe" | ForEach-Object { Copy-Item $_.FullName "mdbtools\bin\" -Force }
              Get-ChildItem "mdbtools_temp\**\*.dll" | ForEach-Object { Copy-Item $_.FullName "mdbtools\lib\" -Force }
              Remove-Item -Recurse -Force "mdbtools_temp"
              Remove-Item -Force $zipPath
              Write-Host "mdbtools downloaded from alternative source"
            } catch {
              Write-Error "All download sources failed"
              exit 1
            }
          }

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pandas pypdf pyinstaller

      - name: Build executable with PyInstaller (using spec file)
        run: |
          pyinstaller rename_pdfs_varsym_windows.spec

      - name: Verify executable
        run: |
          dist\rename_pdfs_varsym.exe --help

      - name: Upload Windows EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rename_pdfs_varsym-windows
          path: dist/rename_pdfs_varsym.exe
          retention-days: 30

      - name: Create release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/rename_pdfs_varsym.exe
          generate_release_notes: true